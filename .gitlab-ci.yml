image: node:20

stages:
  - test

codex-remote-and-extension-tests:
  stage: test
  script:
    - node --check codex-remote/server/server.mjs
    - node --check codex-remote/sidepanel.js
    - node --check codex-remote/options.js
    - node --check codex-remote/mcp/server.mjs
    - cd codex-remote/mcp && npm install --ignore-scripts --no-audit --no-fund
    - cd ../.. && node --test tests/*.js
